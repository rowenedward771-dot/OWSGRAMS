{% extends "base.html" %}{% block title %}Daftar | Owsgram{% endblock %}{% block content %}<div class="mx-auto mt-12 max-w-md rounded-3xl border border-[#dce5dc] bg-white p-8 shadow-[0_12px_35px_rgba(23,33,43,.07)]"><p class="mb-3 text-xs font-bold uppercase tracking-[.2em] text-[#ef7258]">Mulai di Owsgram</p><h1 class="mb-8 text-4xl font-bold">Buat ruangmu sendiri.</h1><form method="post" class="space-y-4"><label class="block text-sm font-bold">Username<input name="username" pattern="[a-zA-Z0-9_]{3,20}" minlength="3" maxlength="20" required class="mt-2 w-full rounded-xl border border-[#dce5dc] px-4 py-3 outline-none focus:border-[#ef7258]"></label><label class="block text-sm font-bold">Email<input name="email" type="email" required class="mt-2 w-full rounded-xl border border-[#dce5dc] px-4 py-3 outline-none focus:border-[#ef7258]"></label><label class="block text-sm font-bold">Password<input name="password" type="password" minlength="8" required class="mt-2 w-full rounded-xl border border-[#dce5dc] px-4 py-3 outline-none focus:border-[#ef7258]"></label><button class="w-full rounded-xl bg-[#17212b] py-3 font-bold text-[#b9f2d0]">Daftar sekarang</button></form><p class="mt-6 text-center text-sm text-slate-500">Sudah punya akun? <a class="font-bold text-[#d85f47]" href="{{ url_for('login') }}">Masuk</a></p></div>{% endblock %}
